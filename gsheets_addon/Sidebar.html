<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         font-size: 13px; background: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }

  #header { background: #1e293b; color: white; padding: 10px 14px;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #header .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
  #header span { font-weight: 600; font-size: 14px; }

  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex;
              flex-direction: column; gap: 8px; }

  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px;
         line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .msg.user { background: #2563eb; color: white; align-self: flex-end;
              border-bottom-right-radius: 3px; }
  .msg.assistant { background: white; color: #1e293b; align-self: flex-start;
                   border: 1px solid #e2e8f0; border-bottom-left-radius: 3px; }
  .msg.error { background: #fee2e2; color: #b91c1c; align-self: flex-start; }

  .changes-box { margin-top: 8px; padding: 8px; background: #f0fdf4;
                 border: 1px solid #bbf7d0; border-radius: 8px; font-size: 12px; }
  .changes-box .label { color: #166534; font-weight: 600; margin-bottom: 4px; }
  .changes-box .preview { color: #15803d; font-family: monospace; margin-bottom: 6px; }
  .changes-box .btns { display: flex; gap: 6px; }
  .btn-apply { flex: 1; background: #16a34a; color: white; border: none;
               border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
  .btn-apply:hover { background: #15803d; }
  .btn-dismiss { flex: 1; background: #e2e8f0; color: #475569; border: none;
                 border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 12px; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px;
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            border-bottom-left-radius: 3px; align-self: flex-start; }
  .typing span { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%;
                 animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  #empty { text-align: center; color: #94a3b8; padding: 32px 16px; line-height: 1.6; }

  #input-area { border-top: 1px solid #e2e8f0; padding: 10px; background: white;
                display: flex; gap: 8px; flex-shrink: 0; }
  #input { flex: 1; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px;
           font-size: 13px; resize: none; outline: none; font-family: inherit; }
  #input:focus { border-color: #2563eb; }
  #send { background: #2563eb; color: white; border: none; border-radius: 8px;
          width: 36px; height: 36px; cursor: pointer; display: flex;
          align-items: center; justify-content: center; flex-shrink: 0; }
  #send:hover { background: #1d4ed8; }
  #send:disabled { background: #94a3b8; cursor: default; }
  #send svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div id="header">
  <div class="dot"></div>
  <span>OptiMystic</span>
</div>

<div id="messages">
  <div id="init-status" style="text-align:center;color:#64748b;padding:32px 16px;line-height:2">
    <div style="display:inline-flex;gap:4px;align-items:center;margin-bottom:10px">
      <span style="width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce 1.2s infinite"></span>
      <span style="width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce 1.2s infinite;animation-delay:.2s"></span>
      <span style="width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce 1.2s infinite;animation-delay:.4s"></span>
    </div><br>
    <span id="init-text">데이터 분석 중...</span>
  </div>
</div>

<div id="input-area">
  <textarea id="input" rows="2" placeholder="메시지 입력... (Shift+Enter 줄바꿈)"></textarea>
  <button id="send" title="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
  var BACKEND = 'https://optimystic-826180130763.asia-northeast3.run.app';
  var chatHistory = [];
  var loading = false;
  var ready = false;
  var cachedAnalysis = null;  // reused in every chat message

  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');

  // disable input until analysis is done
  inputEl.disabled = true;
  sendBtn.disabled = true;
  inputEl.placeholder = '분석 완료 후 입력 가능합니다...';

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(role, content, changes) {
    var init = document.getElementById('init-status');
    if (init) init.remove();

    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : (role === 'error' ? 'error' : 'assistant'));
    div.textContent = content;

    if (changes && changes.length > 0) {
      var box = document.createElement('div');
      box.className = 'changes-box';
      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = '제안 변경사항 (' + changes.length + '개)';
      var preview = document.createElement('div');
      preview.className = 'preview';
      var shown = changes.slice(0, 3).map(function(c) {
        return 'Row ' + (c.row+1) + ' Col ' + (c.col+1) + ' → ' + c.value;
      }).join('\n');
      if (changes.length > 3) shown += '\n... +' + (changes.length - 3) + '개 더';
      preview.textContent = shown;

      var btns = document.createElement('div');
      btns.className = 'btns';
      var applyBtn = document.createElement('button');
      applyBtn.className = 'btn-apply';
      applyBtn.textContent = '✓ 적용';
      applyBtn.onclick = (function(ch, b) {
        return function() {
          b.textContent = '적용 중...';
          b.disabled = true;
          google.script.run
            .withSuccessHandler(function(r) { b.textContent = '✓ 완료 (' + r.count + '개)'; })
            .withFailureHandler(function(e) { b.textContent = '오류: ' + e.message; })
            .applyChanges(ch);
        };
      })(changes, applyBtn);

      var dismissBtn = document.createElement('button');
      dismissBtn.className = 'btn-dismiss';
      dismissBtn.textContent = '✕ 닫기';
      dismissBtn.onclick = function() { box.remove(); };

      btns.appendChild(applyBtn);
      btns.appendChild(dismissBtn);
      box.appendChild(label);
      box.appendChild(preview);
      box.appendChild(btns);
      div.appendChild(box);
    }

    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function showTyping() {
    var div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function hideTyping() {
    var t = document.getElementById('typing');
    if (t) t.remove();
  }

  function send() {
    var msg = inputEl.value.trim();
    if (!msg || loading || !ready) return;
    loading = true;
    inputEl.value = '';
    sendBtn.disabled = true;
    addMessage('user', msg);
    showTyping();

    // Step 1: get sheet data (fast, no HTTP)
    google.script.run
      .withSuccessHandler(function(sheetData) {
        // Step 2: call backend directly via fetch (bypasses Apps Script HTTP hang)
        var done = false;
        var timer = setTimeout(function() {
          if (!done) {
            done = true;
            hideTyping();
            loading = false;
            sendBtn.disabled = false;
            addMessage('error', '응답 시간 초과. 다시 시도해주세요. (첫 번째 메시지는 서버 시작으로 30초+ 걸릴 수 있어요)');
          }
        }, 55000);
        fetch(BACKEND + '/sheets/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            sheet_name: sheetData.sheet_name,
            headers: sheetData.headers,
            rows: sheetData.rows,
            history: chatHistory,
            analysis: cachedAnalysis
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          hideTyping();
          loading = false;
          sendBtn.disabled = false;
          if (res && res.reply) {
            addMessage('assistant', res.reply, res.suggested_changes);
            chatHistory.push({ role: 'user', content: msg });
            chatHistory.push({ role: 'assistant', content: res.reply });
            if (chatHistory.length > 24) chatHistory = chatHistory.slice(-24);
          } else {
            addMessage('error', '빈 응답이 왔어요.');
          }
        })
        .catch(function(e) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          hideTyping();
          loading = false;
          sendBtn.disabled = false;
          addMessage('error', '연결 오류: ' + e.message);
        });
      })
      .withFailureHandler(function(e) {
        hideTyping();
        loading = false;
        sendBtn.disabled = false;
        addMessage('error', '시트 읽기 오류: ' + e.message);
      })
      .getSheetData();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Auto-analyze on open — uses fast Python analysis, no LLM
  function initAnalysis() {
    google.script.run
      .withSuccessHandler(function(sheetData) {
        if (!sheetData.headers.length) {
          finishInit('시트가 비어있어요. 데이터를 입력하면 분석해드릴게요!', null);
          return;
        }

        var initText = document.getElementById('init-text');
        if (initText) initText.textContent = '데이터 분석 중...';

        fetch(BACKEND + '/sheets/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sheet_name: sheetData.sheet_name,
            headers: sheetData.headers,
            rows: sheetData.rows
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(analysis) {
          cachedAnalysis = analysis;

          var lines = ['**' + analysis.sheet_name + '** — ' + analysis.row_count + '행 × ' + analysis.col_count + '열\n'];
          if (analysis.missing_summary && analysis.missing_summary.length) {
            lines.push('⚠️ 결측치: ' + analysis.missing_summary.join(' / '));
          } else {
            lines.push('✅ 결측치 없음');
          }
          if (analysis.numeric_stats) {
            var stats = Object.keys(analysis.numeric_stats).slice(0, 3).map(function(k) {
              var s = analysis.numeric_stats[k];
              return k + ' (평균 ' + s.mean + ')';
            });
            if (stats.length) lines.push('📊 ' + stats.join(', '));
          }
          lines.push('\n질문하거나 최적화를 요청해보세요!');
          finishInit(lines.join('\n'), null);
        })
        .catch(function() {
          finishInit('분석 완료. 질문해주세요!', null);
        });
      })
      .withFailureHandler(function() {
        finishInit('준비 완료. 질문해주세요!', null);
      })
      .getSheetData();
  }

  function finishInit(summary, changes) {
    ready = true;
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = '메시지 입력... (Shift+Enter 줄바꿈)';
    addMessage('assistant', summary, changes);
    inputEl.focus();
  }

  initAnalysis();
</script>
</body>
</html>
