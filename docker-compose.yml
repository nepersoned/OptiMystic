services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimystic-api:latest
    container_name: optimystic-api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      OPTIMYSTIC_PYTHON: "python3"
      OPTIMYSTIC_JULIA: "julia"
      OPTIMYSTIC_PYTHON_TIMEOUT_SECONDS: "180"
      OPTIMYSTIC_JULIA_TIMEOUT_SECONDS: "180"
    command: ["python3", "-m", "uvicorn", "python_solvers.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimystic-jupyterlab:latest
    container_name: optimystic-jupyterlab
    ports:
      - "8888:8888"
    environment:
      OPTIMYSTIC_PYTHON: "python3"
      OPTIMYSTIC_JULIA: "julia"
      OPTIMYSTIC_PYTHON_TIMEOUT_SECONDS: "180"
      OPTIMYSTIC_JULIA_TIMEOUT_SECONDS: "180"
      JUPYTER_ENABLE_LAB: "yes"
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--ServerApp.token=", "--ServerApp.password=", "--ServerApp.root_dir=/app"]
    volumes:
      - ./:/app
    working_dir: /app
    restart: unless-stopped

  agent-loop:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimystic-agent-loop:latest
    container_name: optimystic-agent-loop
    profiles: ["agent"]
    environment:
      LLM_PROVIDER: "google"
      MODEL_NAME: "gemma-4-26b-a4b-it"
      FALLBACK_MODEL: "gemma-4-26b-a4b-it"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-EMPTY}"
    command:
      [
        "python3",
        "agent_loop.py",
        "--llm-provider",
        "${LLM_PROVIDER}",
        "--model",
        "${MODEL_NAME}",
        "--fallback-model",
        "${FALLBACK_MODEL}",
        "--max-steps",
        "10",
        "--chat-timeout-sec",
        "45",
        "--query",
        "examples/sample.csv를 확인하고 packing 도메인으로 매핑 후 optimize까지 실행해줘"
      ]
