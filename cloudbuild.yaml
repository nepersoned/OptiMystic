steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/github.com/nepersoned/optimystic:$COMMIT_SHA
      - -f
      - Dockerfile
      - .

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/github.com/nepersoned/optimystic:$COMMIT_SHA

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=${_PLATFORM}
      - --image=gcr.io/$PROJECT_ID/github.com/nepersoned/optimystic:$COMMIT_SHA
      - --region=${_DEPLOY_REGION}
      - --quiet

substitutions:
  _PLATFORM: managed
  _SERVICE_NAME: optimystic
  _DEPLOY_REGION: asia-northeast3

images:
  - gcr.io/$PROJECT_ID/github.com/nepersoned/optimystic:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
