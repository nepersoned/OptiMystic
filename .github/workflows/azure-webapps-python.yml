name: Build and deploy OptiMystic to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # ⚠️ 아래 이름들이 본인의 Azure 리소스 이름과 일치하는지 꼭 확인하세요!
  AZURE_WEBAPP_NAME: 'optimystic-web'      # 생성할(한) Web App 이름
  ACR_LOGIN_SERVER: 'optimysticreg.azurecr.io' #
  IMAGE_NAME: 'optimystic-app'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          docker login ${{ env.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.REGISTRY_USERNAME }} \
            -p ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}